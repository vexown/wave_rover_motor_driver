[platformio]
; Set the default environment to 'dev'
; You can build/upload prod using: pio run -e prod
default_envs = dev

; =================================================================
; COMMON BASE CONFIGURATION
; All settings shared between dev and prod
; =================================================================
[common_esp32c6]
platform = espressif32
board = seeed_xiao_esp32c6
framework = espidf

monitor_speed = 115200

board_build.flash_size = 4MB
board_build.flash_mode = dio
board_upload_speed = 460800

; OTA partition table with two app partitions for rollback support
board_build.partitions = partitions_ota.csv

; Extract version from CMakeLists.txt automatically
extra_scripts = pre:scripts/extract_version.py

; =================================================================
; DEVELOPMENT ENVIRONMENT
; Inherits from [common_esp32c6]
; =================================================================
[env:dev]
extends = common_esp32c6
build_flags =
    ; Define the development mode flag
    -DOTA_DEVELOPMENT_MODE

; =================================================================
; PRODUCTION ENVIRONMENT
; Inherits from [common_esp32c6]
; =================================================================
[env:prod]
extends = common_esp32c6
; No extra flags needed, so OTA_DEVELOPMENT_MODE is NOT defined